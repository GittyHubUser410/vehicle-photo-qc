[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-photo-qc"
version = "0.1.0"
description = "Local vehicle photography quality review and training library"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "python-multipart>=0.0.20,<1", "pillow>=11.1,<13", "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1"]

[tool.setuptools.packages.find]
where = ["app/backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
